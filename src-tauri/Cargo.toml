[package]
name = "mlbv"
version = "0.0.5"
description = "Minecraft Launcher by vlalikoffc"
authors = ["vlalikoffc"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools feature removed: it shipped DevTools in release builds (landmine).
# DevTools stay available in debug builds (tauri dev) without it.
tauri = { version = "2", features = [] }
url = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }
anyhow = "1"
zip = "0.6"
# std has no SHA-1; Mojang manifests publish SHA-1 hashes used to verify
# client JARs, libraries and assets after download.
sha1 = "0.10"

