name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Frontend: type-check + production bundle ─────────────────────────────
  frontend:
    name: Frontend (tsc + eslint + repo invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      # i18n parity, the frontend↔backend command contract, the 500-line rule
      # and the five version fields. Cheap, and every one of them has already
      # broken once (see scripts/check-repo.mjs).
      - name: Repository invariants
        run: npm run check:repo

      - name: Vite production build
        run: npm run build

  # ── 2. Rust: compile the whole Tauri crate on Linux ────────────────────────
  rust-check:
    name: Rust check (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: cargo check --locked --all-targets
        working-directory: src-tauri
        run: |
          set +e
          cargo check --locked --all-targets --message-format=json > /tmp/check.json 2> /tmp/check.err
          code=$?
          set -e
          exit $code

      - name: cargo test --locked
        working-directory: src-tauri
        run: cargo test --locked

      # Warnings are errors: an unused import or a needless clone fails the
      # build here rather than piling up in the log.
      - name: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
        run: |
          set +e
          cargo clippy --locked --all-targets --message-format=json -- -D warnings > /tmp/clippy.json 2> /tmp/clippy.err
          code=$?
          set -e
          exit $code

      - name: Surface clippy findings as annotations
        if: failure()
        run: |
          jq -r 'select(.reason=="compiler-message") | .message | select(.level=="error" or .level=="warning")
                 | (.spans[0] // {}) as $s
                 | "::\(.level) file=src-tauri/\($s.file_name // "src/main.rs"),line=\($s.line_start // 1),col=\($s.column_start // 1)::\(.message | gsub("%";"%25") | gsub("[\r\n]+";" ") | .[0:400])"' \
            /tmp/clippy.json 2>/dev/null | head -80 || true

      # Raw job logs live on *.blob.core.windows.net, which restricted sandboxes
      # cannot reach; annotations are served from api.github.com instead, so a
      # failing compile stays readable without downloading the log.
      - name: Surface compiler errors as annotations
        if: failure()
        run: |
          jq -r 'select(.reason=="compiler-message") | .message | select(.level=="error")
                 | (.spans[0] // {}) as $s
                 | "::error file=src-tauri/\($s.file_name // "src/main.rs"),line=\($s.line_start // 1),col=\($s.column_start // 1)::\(.message | gsub("%";"%25") | gsub("[\r\n]+";" ") | .[0:400])"' \
            /tmp/check.json | head -60
          {
            echo '### cargo check — last lines of stderr'
            echo '```'
            tail -60 /tmp/check.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Real Windows installer — the artifact that actually ships ───────────
  build-windows:
    name: Full build (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: npm ci
        run: npm ci

      - name: Build installers
        run: npm run tauri build -- --bundles nsis,msi

      - name: List build output
        shell: bash
        run: |
          ls -la src-tauri/target/release/*.exe || true
          ls -laR src-tauri/target/release/bundle/ || true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: mlbv-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # ── 4. Linux packages (.deb + .rpm + AppImage) ───────────────────────────────
  build-linux:
    name: Full build (Linux packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: npm ci
        run: npm ci

      - name: Build packages
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: List build output
        shell: bash
        run: |
          ls -la src-tauri/target/release/bundle/deb/ || true
          ls -la src-tauri/target/release/bundle/rpm/ || true
          ls -la src-tauri/target/release/bundle/appimage/ || true

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: mlbv-linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
