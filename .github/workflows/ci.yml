name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Frontend: type-check + production bundle ─────────────────────────────
  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Vite production build
        run: npm run build

  # ── 2. Rust: compile the whole Tauri crate on Linux ────────────────────────
  rust-check:
    name: Rust check (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: cargo check --locked --all-targets
        working-directory: src-tauri
        run: |
          cargo check --locked --all-targets --message-format=short 2>&1 | tee /tmp/check.txt
          exit "${PIPESTATUS[0]}"

      # Raw job logs live on *.blob.core.windows.net, which restricted sandboxes
      # cannot reach; annotations are served from api.github.com instead, so a
      # failing compile stays readable without downloading the log.
      - name: Surface compiler errors as annotations
        if: failure()
        run: |
          grep -E '^[^ ].*: (error|warning)(\[|:)' /tmp/check.txt | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  # ── 3. Real Windows installer — the artifact that actually ships ───────────
  build-windows:
    name: Full build (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: npm ci
        run: npm ci

      - name: Build installers
        run: npm run tauri build -- --bundles nsis,msi

      - name: List build output
        shell: bash
        run: |
          ls -la src-tauri/target/release/*.exe || true
          ls -laR src-tauri/target/release/bundle/ || true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: mlbv-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
