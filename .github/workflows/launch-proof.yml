name: Launch proof (headless Minecraft on Linux)

# Manual-only: boots a real Minecraft client through the actual launch
# pipeline on a CI runner (network + xvfb + Mesa llvmpipe) and asserts the
# JVM prints its LWJGL banner. Too slow and too network-hungry for every
# push — trigger by hand after touching the launch flow:
#   gh workflow run launch-proof.yml [-f mc_version=1.20.1]
# Proof is emitted as check-run annotations (readable via the API) because
# raw logs live on blob storage that restricted sandboxes cannot reach.

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Vanilla version to boot'
        default: '1.20.1'

jobs:
  proof:
    name: Install .deb and boot Minecraft headless
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MLBV_PROOF_MC_VERSION: ${{ inputs.mc_version }}
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config \
            xvfb \
            mesa-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci and frontend build
        run: |
          npm ci
          npm run build

      - name: Build the .deb
        run: npm run tauri build -- --bundles deb

      - name: Install the .deb and smoke-run the app
        run: |
          sudo dpkg -i src-tauri/target/release/bundle/deb/*.deb
          # The installed app must stay alive under a virtual display; timeout
          # killing it (exit 124) is the success case, an early exit is a crash.
          set +e
          timeout 90 xvfb-run -a /usr/bin/mlbv
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error title=Installed app::exited early under xvfb (code $code), expected to stay alive"
            exit 1
          fi
          echo "Installed app stayed alive 90 s under xvfb."

      - name: Boot real Minecraft through the launch pipeline
        working-directory: src-tauri
        run: xvfb-run -a cargo test --locked --test headless_launch -- --ignored --nocapture

      - name: Emit proof annotations
        if: always()
        run: |
          LOG="$HOME/.mlbv/instances/ci-proof/logs/latest.log"
          if [ -f "$LOG" ] && grep -q "LWJGL Version" "$LOG"; then
            line=$(grep -m1 "LWJGL Version" "$LOG" | head -c 300 | tr -d '\r\n' | sed 's/%/%25/g')
            ogl=$(grep -m1 -i "OpenGL:" "$LOG" | head -c 300 | tr -d '\r\n' | sed 's/%/%25/g')
            echo "::notice title=Minecraft booted headless::$line"
            [ -n "$ogl" ] && echo "::notice title=OpenGL::$ogl"
          else
            echo "::error title=Launch proof::no LWJGL banner in $LOG"
            tail -c 2000 "$LOG" 2>/dev/null || echo "(no log file)"
          fi
